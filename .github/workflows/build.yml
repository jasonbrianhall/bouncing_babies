name: Build Bouncing Babies

on:
  push:
    branches: [ main, dev ]
    paths:
      - '**.cpp'
      - '**.h'
      - 'Makefile'
      - '**/Makefile'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - '**.yml'
      - '**.yaml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - '**.cpp'
      - '**.h'
      - 'Makefile'
      - '**/Makefile'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - '**.yml'
      - '**.yaml'
  workflow_dispatch:

env:
  PRODUCT_VERSION: "1.0.${{ github.run_number }}.0"
  UPGRADE_CODE: "c0d80fc2-821d-4929-b864-05fa5d8f940d"

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            vcpkg_triplet: x64-windows
            cmake_arch: x64
            artifact_name: bouncing-babies-build
            zip_name: BouncingBabies-Portable.zip
          - arch: arm64
            vcpkg_triplet: arm64-windows
            cmake_arch: ARM64
            artifact_name: bouncing-babies-build-arm64
            zip_name: BouncingBabies-Portable-arm64.zip

    steps:
    - uses: actions/checkout@v4

    - name: Bootstrap vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat

    - name: Install dependencies (${{ matrix.vcpkg_triplet }})
      run: |
        .\vcpkg\vcpkg.exe install --triplet ${{ matrix.vcpkg_triplet }} --x-manifest-root=. --x-install-root=vcpkg\installed

    - name: Install pkg-config
      run: choco install pkgconfiglite -y --no-progress

    - name: Configure
      env:
        PKG_CONFIG_PATH: ${{ github.workspace }}\vcpkg\installed\${{ matrix.vcpkg_triplet }}\lib\pkgconfig
      run: |
        cmake -B build-${{ matrix.arch }} -A ${{ matrix.cmake_arch }} `
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} `
          -DVCPKG_INSTALLED_DIR="${{ github.workspace }}\vcpkg\installed" `
          -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cmake --build build-${{ matrix.arch }} --config Release --target bouncingbabies

    - name: Convert PNG icon to ICO
      run: |
        if (Test-Path "icon.png") {
          magick icon.png -resize 256x256 -colors 256 icon.ico
        } else {
          Write-Host "⚠️  icon.png not found at repo root"
        }

    - name: Package
      run: |
        New-Item -ItemType Directory -Force -Path "package" | Out-Null
        Copy-Item "build-${{ matrix.arch }}\Release\bouncingbabies.exe" "package\"
        Copy-Item "vcpkg\installed\${{ matrix.vcpkg_triplet }}\bin\*.dll" "package\"
        Copy-Item "README.md" "package\" -ErrorAction SilentlyContinue
        Copy-Item "LICENSE.md" "package\" -ErrorAction SilentlyContinue
        Copy-Item "icon.png" "package\" -ErrorAction SilentlyContinue
        Copy-Item "icon.ico" "package\" -ErrorAction SilentlyContinue

        if (-not (Test-Path "package\bouncingbabies.exe")) {
          Write-Error "bouncingbabies.exe not found — build failed"
          exit 1
        }

        $dllCount = (Get-ChildItem "package\*.dll" -ErrorAction SilentlyContinue).Count
        if ($dllCount -eq 0) {
          Write-Error "No DLLs were copied from vcpkg\installed\${{ matrix.vcpkg_triplet }}\bin — packaging would produce a broken zip"
          exit 1
        }
        Write-Host "📦 Packaged $dllCount DLL(s):"
        Get-ChildItem "package\*.dll" | ForEach-Object { Write-Host "  - $($_.Name) ($($_.Length) bytes)" }

        Compress-Archive -Path "package\*" -DestinationPath "${{ matrix.zip_name }}"

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.zip_name }}
        retention-days: 7

  build-msi-windows:
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: bouncing-babies-build
        path: .

    - name: Extract Build Files
      run: |
        Expand-Archive -Path "BouncingBabies-Portable.zip" -DestinationPath "artifacts/build/windows/" -Force

    - name: Setup WiX Toolset
      run: |
        Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip" -OutFile "wix.zip"
        Expand-Archive -Path "wix.zip" -DestinationPath "wix"
        echo "$env:GITHUB_WORKSPACE\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Generate MSI Installer
      working-directory: artifacts/build/windows
      run: |
        $version = "${{ env.PRODUCT_VERSION }}"
        $upgradeCode = "${{ env.UPGRADE_CODE }}"

        # Generate component entries for all DLLs
        $dllEntries = Get-ChildItem -Name "*.dll" | ForEach-Object {
          $safeId = $_ -replace '[^a-zA-Z0-9]', '_'
          "                <File Id=`"$safeId`" Name=`"$_`" Source=`"$_`"/>"
        }

        @"
        <?xml version="1.0" encoding="UTF-8"?>
        <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">

          <Product Id="*"
                   Name="Bouncing Babies"
                   Language="1033"
                   Version="$version"
                   Manufacturer="Bouncing Babies"
                   UpgradeCode="$upgradeCode">

            <Package InstallerVersion="500" Compressed="yes" InstallScope="perMachine"
                     Description="Bouncing Babies - SDL Accelerated Video Game"
                     Manufacturer="Bouncing Babies" />

            <MajorUpgrade DowngradeErrorMessage="A newer version of Bouncing Babies is already installed."
                          Schedule="afterInstallInitialize" />
            <MediaTemplate EmbedCab="yes" CompressionLevel="high" />

            <Icon Id="BouncingBabiesIcon" SourceFile="icon.ico" />
            <Property Id="ARPPRODUCTICON" Value="BouncingBabiesIcon" />
            <Property Id="ARPHELPLINK" Value="https://github.com/jasonbrianhall/bouncing_babies" />
            <Property Id="ARPURLINFOABOUT" Value="https://github.com/jasonbrianhall/bouncing_babies" />
            <Property Id="ARPCOMMENTS" Value="An SDL built video game" />

            <WixVariable Id="WixUILicenseRtf" Value="License.rtf" />
            <Property Id="WIXUI_INSTALLDIR" Value="INSTALLFOLDER" />
            <Property Id="DESKTOP_SHORTCUT" Value="1" />

            <Directory Id="TARGETDIR" Name="SourceDir">
              <Directory Id="ProgramFiles64Folder">
                <Directory Id="INSTALLFOLDER" Name="Bouncing Babies" />
              </Directory>
              <Directory Id="ProgramMenuFolder">
                <Directory Id="ApplicationProgramsFolder" Name="Bouncing Babies" />
              </Directory>
              <Directory Id="DesktopFolder" />
            </Directory>

            <!-- Main executable and all DLL dependencies -->
            <DirectoryRef Id="INSTALLFOLDER">
              <Component Id="MainExecutable" Guid="98CE260B-CBA1-494E-A265-760928737623" Win64="yes">
                <File Id="bouncingbabies_exe" Name="bouncingbabies.exe" Source="bouncingbabies.exe" />

                <!-- Start Menu shortcut -->
                <Shortcut Id="StartMenuShortcut"
                          Directory="ApplicationProgramsFolder"
                          Name="Bouncing Babies"
                          Description="Bouncing Babies - SDL Accelerated Video Game"
                          Target="[INSTALLFOLDER]bouncingbabies.exe"
                          WorkingDirectory="INSTALLFOLDER"
                          Icon="BouncingBabiesIcon"
                          IconIndex="0" />

                <!-- Registry KeyPath required for non-advertised shortcuts -->
                <RegistryValue Root="HKCU" Key="Software\BouncingBabies" Name="installed"
                               Type="integer" Value="1" KeyPath="yes" />

                <!-- DLL dependencies -->
                $($dllEntries -join "`r`n")
              </Component>
            </DirectoryRef>

            <!-- Start Menu folder cleanup on uninstall (fixes ICE64) -->
            <DirectoryRef Id="ApplicationProgramsFolder">
              <Component Id="StartMenuFolder" Guid="73EB465F-D63E-4F72-B0FF-4553AE0865C2" Win64="yes">
                <RemoveFolder Id="ApplicationProgramsFolderRemove" On="uninstall" />
                <RegistryValue Root="HKCU" Key="Software\BouncingBabies\Shortcuts" Name="StartMenu"
                               Type="integer" Value="1" KeyPath="yes" />
              </Component>
            </DirectoryRef>

            <!-- Desktop shortcuts (optional) -->
            <DirectoryRef Id="DesktopFolder">
              <Component Id="DesktopShortcut" Guid="AD438801-1B54-464C-ACC8-77E548245645" Win64="yes">
                <Condition>DESKTOP_SHORTCUT=1</Condition>
                <Shortcut Id="DesktopShortcutMain"
                          Directory="DesktopFolder"
                          Name="Bouncing Babies"
                          Description="Bouncing Babies - SDL Accelerated Video Game"
                          Target="[INSTALLFOLDER]bouncingbabies.exe"
                          WorkingDirectory="INSTALLFOLDER"
                          Icon="BouncingBabiesIcon"
                          IconIndex="0" />

                <RegistryValue Root="HKCU" Key="Software\BouncingBabies\Shortcuts" Name="Desktop"
                               Type="integer" Value="1" KeyPath="yes" />
              </Component>
            </DirectoryRef>

            <Feature Id="MainFeature" Title="Bouncing Babies" Level="1">
              <ComponentRef Id="MainExecutable" />
              <ComponentRef Id="StartMenuFolder" />
              <ComponentRef Id="DesktopShortcut" />
            </Feature>

            <UIRef Id="WixUI_InstallDir" />
            <UIRef Id="WixUI_ErrorProgressText" />

            <InstallExecuteSequence>
              <Custom Action="SetARPINSTALLLOCATION" After="InstallValidate" />
            </InstallExecuteSequence>
            <CustomAction Id="SetARPINSTALLLOCATION" Property="ARPINSTALLLOCATION" Value="[INSTALLFOLDER]" />

          </Product>
        </Wix>
        "@ | Out-File -FilePath "bouncing_babies.wxs" -Encoding UTF8

        # Create RTF license if not present
        if (-not (Test-Path "License.rtf")) {
          @"
        {\rtf1\ansi\ansicpg1252
        {\colortbl;\red255\green255\blue255;}
        \margl1440\margr1440\vieww11900\viewh8605\viewkind0
        \pard\tx720\tx1440\tx2160\tx2880\tx3600\tx4320\pardirnatural\partightenfactor0
        \f0\fs20 \cf0 MIT License\
        \
        Copyright (c) 2025 Bouncing Babies Contributors\
        \
        Permission is hereby granted, free of charge, to any person obtaining a copy of this software and associated documentation files (the "Software"), to deal in the Software without restriction, including without limitation the rights to use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies of the Software, and to permit persons to whom the Software is furnished to do so, subject to the following conditions:\
        \
        The above copyright notice and this permission notice shall be included in all copies or substantial portions of the Software.\
        \
        THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE SOFTWARE.}
        "@ | Out-File -FilePath "License.rtf" -Encoding ASCII
        }

        Write-Host "Compiling WXS..."
        & candle.exe -out "bouncing_babies.wixobj" -arch x64 "bouncing_babies.wxs"
        if ($LASTEXITCODE -ne 0) { Write-Error "Candle failed"; exit 1 }

        Write-Host "Linking MSI..."
        & light.exe -out "BouncingBabies.msi" -ext WixUIExtension -ext WixUtilExtension "bouncing_babies.wixobj"
        if ($LASTEXITCODE -ne 0) { Write-Error "Light failed"; exit 1 }

        if (Test-Path "BouncingBabies.msi") {
          Write-Host "✅ MSI created: BouncingBabies.msi ($((Get-Item 'BouncingBabies.msi').Length) bytes)"
        } else {
          Write-Error "❌ MSI not created"; exit 1
        }

    - name: Upload MSI
      uses: actions/upload-artifact@v4
      with:
        name: BouncingBabies.msi
        path: artifacts/build/windows/BouncingBabies.msi
        retention-days: 7

  build-msix-windows:
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - arch: x64
            artifact_name: bouncing-babies-build
            zip_name: BouncingBabies-Portable.zip
          - arch: arm64
            artifact_name: bouncing-babies-build-arm64
            zip_name: BouncingBabies-Portable-arm64.zip

    steps:
    - uses: actions/checkout@v4

    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: .

    - name: Extract Build Files
      run: |
        Expand-Archive -Path "${{ matrix.zip_name }}" -DestinationPath "msix-source\" -Force

    - name: Prepare MSIX Package Structure
      run: |
        New-Item -ItemType Directory -Force -Path "msix-package/Assets"
        New-Item -ItemType Directory -Force -Path "msix-package/Files"

        Copy-Item "msix-source/*" -Destination "msix-package/Files/" -Recurse -Force

        if (-not (Test-Path "msix-package/Files/bouncingbabies.exe")) {
          Write-Error "bouncingbabies.exe not found in package!"
          exit 1
        }

        Write-Host "✅ bouncingbabies.exe verified in MSIX package"
        Write-Host "📦 MSIX Files directory contents:"
        Get-ChildItem "msix-package/Files/" -File | ForEach-Object { 
          $size = "{0:N0}" -f $_.Length
          Write-Host "  - $($_.Name) ($size bytes)" 
        }

    - name: Create MSIX Store Compliant Assets
      run: |
        $iconPath = "msix-source/icon.png"

        if (-not (Test-Path $iconPath)) {
          Write-Error "icon.png not found - cannot create Store assets"
          exit 1
        }

        Write-Host "Creating Microsoft Store compliant assets..."

        # StoreLogo (50x50 base)
        & magick "$iconPath" -resize 50x50   "msix-package/Assets/StoreLogo.scale-100.png"
        & magick "$iconPath" -resize 63x63   "msix-package/Assets/StoreLogo.scale-125.png"
        & magick "$iconPath" -resize 75x75   "msix-package/Assets/StoreLogo.scale-150.png"
        & magick "$iconPath" -resize 100x100 "msix-package/Assets/StoreLogo.scale-200.png"

        # Square 44x44 (small tile)
        & magick "$iconPath" -resize 44x44 "msix-package/Assets/BouncingBabies44x44.scale-100.png"
        & magick "$iconPath" -resize 55x55 "msix-package/Assets/BouncingBabies44x44.scale-125.png"
        & magick "$iconPath" -resize 66x66 "msix-package/Assets/BouncingBabies44x44.scale-150.png"
        & magick "$iconPath" -resize 88x88 "msix-package/Assets/BouncingBabies44x44.scale-200.png"

        # Square 150x150 (main tile)
        & magick "$iconPath" -resize 150x150 "msix-package/Assets/BouncingBabiesLogo.scale-100.png"
        & magick "$iconPath" -resize 188x188 "msix-package/Assets/BouncingBabiesLogo.scale-125.png"
        & magick "$iconPath" -resize 225x225 "msix-package/Assets/BouncingBabiesLogo.scale-150.png"
        & magick "$iconPath" -resize 300x300 "msix-package/Assets/BouncingBabiesLogo.scale-200.png"

        # Wide 310x150 (wide tile)
        & magick "$iconPath" -resize 150x150 -background "#0d1117" -gravity center -extent 310x150 "msix-package/Assets/BouncingBabiesWide.scale-100.png"
        & magick "$iconPath" -resize 188x188 -background "#0d1117" -gravity center -extent 388x188 "msix-package/Assets/BouncingBabiesWide.scale-125.png"
        & magick "$iconPath" -resize 225x225 -background "#0d1117" -gravity center -extent 465x225 "msix-package/Assets/BouncingBabiesWide.scale-150.png"
        & magick "$iconPath" -resize 300x300 -background "#0d1117" -gravity center -extent 620x300 "msix-package/Assets/BouncingBabiesWide.scale-200.png"

        Write-Host "✅ All Microsoft Store assets created successfully"

    - name: Create MSIX Manifest
      working-directory: msix-package
      run: |
        @"
        <?xml version="1.0" encoding="utf-8"?>
        <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
                 xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
                 xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities">

          <Identity
            Name="JasonBrianHall.BouncingBabies"
            Publisher="CN=EB5808A3-75E0-4804-8BAC-A1D2DC2F5A85"
            Version="${{ env.PRODUCT_VERSION }}"
            ProcessorArchitecture="${{ matrix.arch }}" />

          <Properties>
            <DisplayName>Bouncing Babies</DisplayName>
            <PublisherDisplayName>Jason Brian Hall</PublisherDisplayName>
            <Description>An SDL built video game.</Description>
            <Logo>Assets\StoreLogo.scale-100.png</Logo>
          </Properties>

          <Dependencies>
            <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.26100.0" />
          </Dependencies>

          <Resources>
            <Resource Language="en-us" />
          </Resources>

          <Applications>
            <Application Id="BouncingBabies" Executable="Files\bouncingbabies.exe" EntryPoint="Windows.FullTrustApplication">
              <uap:VisualElements DisplayName="Bouncing Babies"
                                  Description="An SDL built video game."
                                  Square150x150Logo="Assets\BouncingBabiesLogo.scale-100.png"
                                  Square44x44Logo="Assets\BouncingBabies44x44.scale-100.png"
                                  BackgroundColor="#0d1117">
                <uap:DefaultTile Wide310x150Logo="Assets\BouncingBabiesWide.scale-100.png"
                                 ShortName="Bouncing Babies">
                  <uap:ShowNameOnTiles>
                    <uap:ShowOn Tile="square150x150Logo"/>
                    <uap:ShowOn Tile="wide310x150Logo"/>
                  </uap:ShowNameOnTiles>
                </uap:DefaultTile>
                <uap:SplashScreen Image="Assets\BouncingBabiesLogo.scale-100.png" />
              </uap:VisualElements>
            </Application>
          </Applications>

          <Capabilities>
            <rescap:Capability Name="runFullTrust" />
          </Capabilities>
        </Package>
        "@ | Out-File -FilePath "AppxManifest.xml" -Encoding UTF8

    - name: Build MSIX Package
      run: |
        $makeAppxPath = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.22621.0\x64\makeappx.exe"

        if (-not (Test-Path $makeAppxPath)) {
          $sdkVersions = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\" |
            Where-Object { $_.Name -match "10\.0\.\d+\.\d+" } |
            Sort-Object Name -Descending
          foreach ($version in $sdkVersions) {
            $testPath = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\$($version.Name)\x64\makeappx.exe"
            if (Test-Path $testPath) { $makeAppxPath = $testPath; break }
          }
        }

        if (-not (Test-Path $makeAppxPath)) {
          Write-Error "MakeAppx.exe not found."
          exit 1
        }

        Write-Host "Using MakeAppx at: $makeAppxPath"
        $msixName = "BouncingBabies-${{ matrix.arch }}.msix"
        & "$makeAppxPath" pack /d "msix-package" /p "$msixName" /o

        if ($LASTEXITCODE -ne 0) { Write-Error "MSIX creation failed"; exit 1 }

        if (Test-Path $msixName) {
          Write-Host "✅ MSIX created: $msixName ($((Get-Item $msixName).Length) bytes)"
          Write-Host "Package is unsigned and ready for Microsoft Store submission"
        } else {
          Write-Error "❌ MSIX not created"; exit 1
        }

    - name: Upload MSIX
      uses: actions/upload-artifact@v4
      with:
        name: BouncingBabies-${{ matrix.arch }}.msix
        path: BouncingBabies-${{ matrix.arch }}.msix
        retention-days: 7

  create-release:
    needs: [build-windows, build-msi-windows, build-msix-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push'

    steps:
    - name: Download MSI Artifact
      uses: actions/download-artifact@v4
      with:
        name: BouncingBabies.msi
        path: release

    - name: Download MSIX Artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: BouncingBabies-*.msix
        path: release
        merge-multiple: true

    - name: Download Portable Artifact (x64)
      uses: actions/download-artifact@v4
      with:
        name: bouncing-babies-build
        path: release

    - name: Download Portable Artifact (arm64)
      uses: actions/download-artifact@v4
      with:
        name: bouncing-babies-build-arm64
        path: release

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release/BouncingBabies.msi
          release/BouncingBabies-x64.msix
          release/BouncingBabies-arm64.msix
          release/BouncingBabies-Portable.zip
          release/BouncingBabies-Portable-arm64.zip
        tag_name: ${{ github.ref == 'refs/heads/main' && format('v{0}', github.run_number) || format('dev-v{0}', github.run_number) }}
        name: ${{ github.ref == 'refs/heads/main' && format('Release v{0}', github.run_number) || format('Dev Build v{0}', github.run_number) }}
        draft: false
        prerelease: ${{ github.ref != 'refs/heads/main' }}
        make_latest: ${{ github.ref == 'refs/heads/main' }}
        body: |
          ## ${{ github.ref == 'refs/heads/main' && 'Stable Release' || 'Development Build' }}

          **Version:** ${{ env.PRODUCT_VERSION }}
          **Commit:** ${{ github.sha }}
          **Build:** #${{ github.run_number }}

          ### 👶 Bouncing Babies
          An SDL accelerated video game for Windows and Linux.

          ### 📦 Downloads
          - **BouncingBabies.msi** — Windows installer with Start Menu and optional desktop shortcuts
          - **BouncingBabies.msix** — Unsigned package ready for Microsoft Store submission
          - **BouncingBabies-Portable.zip** — Portable version, no installation required

          ### ✨ Installer Features (MSI)
          - ✅ Start Menu shortcut
          - ✅ Optional desktop shortcut
          - ✅ Custom installation directory
          - ✅ Proper uninstall support
          - ✅ Add/Remove Programs integration

          ### 🏪 Microsoft Store Submission
          The MSIX package is **unsigned** and ready for submission via Partner Center. Before uploading:
          1. Update the `Identity Name` and `Publisher` in the manifest with your Partner Center values
          2. Upload the unsigned MSIX — Microsoft handles signing during certification

          ### 📦 Package Comparison
          | Feature | MSI | MSIX | Portable |
          |---------|-----|------|----------|
          | Installation Required | Yes | Yes | No |
          | Start Menu Integration | ✅ | ✅ | ❌ |
          | Auto-Update Support | ❌ | ✅ | ❌ |
          | Microsoft Store Ready | ❌ | ✅ | ❌ |
          | Sandboxed | ❌ | ✅ | ❌ |
          | Traditional Uninstall | ✅ | ✅ | ❌ |
          | Code Signing Required | ✅ | Store | ❌ |

          ### 🚀 Usage
          Launch **bouncingbabies.exe** from the Start Menu or desktop shortcut.

          ### 🎯 Silent Installation (MSI)
          ```cmd
          msiexec /i BouncingBabies.msi /quiet /norestart
          msiexec /i BouncingBabies.msi /quiet /norestart DESKTOP_SHORTCUT=1
          msiexec /x BouncingBabies.msi /quiet /norestart
          ```

          ---
          *Built with ❤️ using GitHub Actions*
